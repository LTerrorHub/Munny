name: Munny 2.5 - Saude e Investimentos
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/compilar-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK do runner
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar APK debug de validação
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Compilar APK release de distribuição
        env:
          MUNNY_KEYSTORE_BASE64: ${{ secrets.MUNNY_KEYSTORE_BASE64 }}
          MUNNY_STORE_PASSWORD: ${{ secrets.MUNNY_STORE_PASSWORD }}
          MUNNY_KEY_ALIAS: ${{ secrets.MUNNY_KEY_ALIAS }}
          MUNNY_KEY_PASSWORD: ${{ secrets.MUNNY_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${MUNNY_KEYSTORE_BASE64:-}" && -n "${MUNNY_STORE_PASSWORD:-}" && -n "${MUNNY_KEY_ALIAS:-}" && -n "${MUNNY_KEY_PASSWORD:-}" ]]; then
            printf '%s' "$MUNNY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/munny-release.p12"
            export MUNNY_KEYSTORE_PATH="$RUNNER_TEMP/munny-release.p12"
            echo "SIGNED_RELEASE_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "Chave privada ausente; criando APK release não assinado, para assinatura fora do GitHub."
            echo "SIGNED_RELEASE_AVAILABLE=false" >> "$GITHUB_ENV"
          fi
          gradle --no-daemon :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Munny-2.5-debug-validacao
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Release assinado (se configurada a keystore)
        if: env.SIGNED_RELEASE_AVAILABLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Munny-2.5-release-assinado
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Release sem assinatura (exige assinatura antes de instalar)
        if: env.SIGNED_RELEASE_AVAILABLE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Munny-2.5-release-unsigned
          path: app/build/outputs/apk/release/*unsigned.apk
          if-no-files-found: error
